<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="ScoutAI: scouting calcistico sui dati reali. Cerca, confronta e capisci i giocatori." />
    <title>ScoutAI</title>
    <script>
      // Tema applicato prima del primo paint per evitare il lampo del tema sbagliato.
      try {
        var saved = localStorage.getItem('scoutai.theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var lang = localStorage.getItem('scoutai.lang')
        if (lang === 'en' || lang === 'it') document.documentElement.lang = lang
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
