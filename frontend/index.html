<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0F14" />
    <meta name="description" content="Scout AI: il talento giusto, al momento giusto. Scouting calcistico sui dati reali." />
    <title>Scout AI</title>
    <script>
      // Tema applicato prima del primo paint per evitare il lampo del tema sbagliato.
      try {
        var saved = localStorage.getItem('scoutai.theme')
        var dark = saved ? saved === 'dark' : true // il brand nasce scuro: è il tema di partenza
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var lang = localStorage.getItem('scoutai.lang')
        if (lang === 'en' || lang === 'it') document.documentElement.lang = lang
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
