spring.application.name=ScoutAI

# Su Render la porta arriva dalla variabile PORT; in locale resta 8080
server.port=${PORT:8080}
# Dietro il proxy di Render l'IP del client sta in X-Forwarded-For. Con "native" Tomcat lo legge solo dai proxy
# fidati (reti private), quindi il limite delle chiamate AI vale per ogni utente e non per tutto il sito.
# Va attivato solo online (SERVER_FORWARD_HEADERS_STRATEGY=native): in locale nessun proxy, valore "none".
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Legge le variabili dal file .env nella radice del repo (opzionale: se manca usa i default sotto)
spring.config.import=optional:file:../.env[.properties]

# In locale bastano nome e porta. Online Render fornisce host, porta e nome del database come valori separati
# (SCOUTAI_DB_HOST...); chi ha un indirizzo JDBC completo può usare SCOUTAI_DB_URL, che ha la precedenza.
spring.datasource.url=${SCOUTAI_DB_URL:jdbc:postgresql://${SCOUTAI_DB_HOST:localhost}:${SCOUTAI_DB_PORT:5432}/${SCOUTAI_DB_NAME:scoutai}}
spring.datasource.username=${SCOUTAI_DB_USER:scoutai}
spring.datasource.password=${SCOUTAI_DB_PASSWORD:scoutai}
# Pochi collegamenti (i database gratuiti ne ammettono pochi) e rinnovati prima che il database li chiuda da solo
spring.datasource.hikari.maximum-pool-size=${SCOUTAI_DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=240000

scoutai.api-football.base-url=${API_FOOTBALL_BASE_URL:https://v3.football.api-sports.io}
scoutai.api-football.key=${API_FOOTBALL_KEY:}
scoutai.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
scoutai.openrouter.key=${OPENROUTER_API_KEY:}
scoutai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
# Solo per i modelli che ragionano (es. gpt-oss su Groq): low|medium|high. Vuoto = non inviato
scoutai.openrouter.reasoning-effort=${OPENROUTER_REASONING_EFFORT:}
scoutai.security.admin-key=${ADMIN_API_KEY:}
scoutai.security.cors-allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Import da API-Football: budget giornaliero (il limite reale del piano Free e' 100), stagioni in ordine di priorita'
scoutai.import.daily-budget=90
scoutai.import.seasons=2024,2023,2022
# Online lo spegniamo (SCOUTAI_IMPORT_AUTO_ENABLED=false): il servizio gratuito si addormenta e a ogni risveglio
# ripartirebbe l'import. A lanciarlo ogni giorno ci pensa il workflow .github/workflows/daily-import.yml.
scoutai.import.auto-enabled=${SCOUTAI_IMPORT_AUTO_ENABLED:true}

# Percentili: minuti minimi per entrare nella coorte e dimensione minima della coorte
scoutai.stats.min-minutes=450
scoutai.stats.min-cohort-size=10
