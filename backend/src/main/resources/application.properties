spring.application.name=ScoutAI

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Legge le variabili dal file .env nella radice del repo (opzionale: se manca usa i default sotto)
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${SCOUTAI_DB_PORT:5432}/${SCOUTAI_DB_NAME:scoutai}
spring.datasource.username=${SCOUTAI_DB_USER:scoutai}
spring.datasource.password=${SCOUTAI_DB_PASSWORD:scoutai}

scoutai.api-football.base-url=${API_FOOTBALL_BASE_URL:https://v3.football.api-sports.io}
scoutai.api-football.key=${API_FOOTBALL_KEY:}
scoutai.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
scoutai.openrouter.key=${OPENROUTER_API_KEY:}
scoutai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
scoutai.security.admin-key=${ADMIN_API_KEY:}
scoutai.security.cors-allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Import da API-Football: budget giornaliero (il limite reale del piano Free e' 100), stagioni in ordine di priorita'
scoutai.import.daily-budget=90
scoutai.import.seasons=2024,2023
scoutai.import.auto-enabled=false

# Percentili: minuti minimi per entrare nella coorte e dimensione minima della coorte
scoutai.stats.min-minutes=450
scoutai.stats.min-cohort-size=10
